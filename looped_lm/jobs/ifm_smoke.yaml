name: looped-lm-ifm-smoke
setup: bash looped_lm/jobs/ifm_env.sh && ln -sfn "$GPUC_DATA_DIR/looped-lm-ifm/env" ifm-env
python: ifm-env/bin/python
command: bash looped_lm/jobs/ifm.sh ifm_models=[dense-ouro-336b] "ifm_args=--n-seq 8 --n-pos 16 --n-omp 64"
gpus: 1
use_shared: true
env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "8"
secrets: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, HF_TOKEN]
outputs:
  - path: results/looped-lm
    s3: s3://brendanlong-experiments/looped-lm/{job_id}/results
sync_interval_s: 300
priority: 90
auto_preempt: true
estimated_runtime_min: 60
